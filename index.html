<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Seminar Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <section class="registration-card">
            <h1>IT Seminar Registration</h1>
            <p class="intro">
                Please fill out the form to register for the upcoming IT seminar.
            </p>

            <form id="registrationForm" novalidate>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        required
                        aria-describedby="fullNameError"
                        aria-invalid="false"
                    >
                    <p id="fullNameError" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="studentNumber">Student Number</label>
                    <input
                        type="text"
                        id="studentNumber"
                        name="studentNumber"
                        required
                        aria-describedby="studentNumberError"
                        aria-invalid="false"
                    >
                    <p id="studentNumberError" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        aria-describedby="emailError"
                        aria-invalid="false"
                    >
                    <p id="emailError" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="mobileNumber">Mobile Number</label>
                    <input
                        type="tel"
                        id="mobileNumber"
                        name="mobileNumber"
                        required
                        aria-describedby="mobileNumberError"
                        aria-invalid="false"
                    >
                    <p id="mobileNumberError" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        aria-describedby="passwordError passwordFeedback"
                        aria-invalid="false"
                    >
                    <p id="passwordFeedback" class="password-feedback"></p>
                    <p id="passwordError" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        aria-describedby="confirmPasswordError"
                        aria-invalid="false"
                    >
                    <p id="confirmPasswordError" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <select
                        id="course"
                        name="course"
                        required
                        aria-describedby="courseError"
                        aria-invalid="false"
                    >
                        <option value="">Select your course</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSCS">BSCS</option>
                    </select>
                    <p id="courseError" class="error-message"></p>
                </div>

                <div class="terms-group">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                        aria-describedby="termsError"
                        aria-invalid="false"
                    >
                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>
                </div>

                <p id="termsError" class="error-message"></p>

                <div class="button-group">
                    <button type="submit" id="registerBtn">Register</button>
                    <button type="reset" id="resetBtn">Reset</button>
                </div>

            </form>

            <p id="successMessage" class="success-message"></p>

            <section id="registrationSummary" class="summary">
                <h2>Registration Summary</h2>

                <p>
                    <strong>Full Name:</strong>
                    <span id="summaryName"></span>
                </p>

                <p>
                    <strong>Student Number:</strong>
                    <span id="summaryStudentNumber"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="summaryEmail"></span>
                </p>

                <p>
                    <strong>Mobile Number:</strong>
                    <span id="summaryMobileNumber"></span>
                </p>

                <p>
                    <strong>Course:</strong>
                    <span id="summaryCourse"></span>
                </p>
            </section>

        </section>
    </main>

    <script src="js/app.js" defer></script>
</body>
</html>
